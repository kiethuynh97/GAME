<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vườn Trăng Ngủ 🌙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0f28;
    --bg-mid:#0f1c3f;
    --tile:#152a52;
    --tile-edge:#2c4d8c;
    --lavender:#7fb2ff;
    --gold:#ffd37b;
    --pink:#5fd6e8;
    --cream:#eaf1ff;
    --muted:#6f89bd;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(1200px 600px at 15% -10%, #17297a 0%, transparent 60%),
      radial-gradient(1000px 700px at 110% 10%, #0e3a70 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-deep), var(--bg-mid));
    color:var(--cream);
    font-family:'Nunito',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 14px 60px;
    overflow-x:hidden;
    position:relative;
  }
  /* twinkling stars */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .star{position:absolute;background:#fff;border-radius:50%;opacity:.5;animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.8;}}

  /* ambient fireflies + clouds, always animating */
  .ambient-layer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .firefly{position:fixed;border-radius:50%;background:#ffe9a8;box-shadow:0 0 10px 3px rgba(255,233,168,.55);opacity:.75;}
  .firefly.f1{width:5px;height:5px;top:16%;left:8%;animation:fireflyDrift1 9s ease-in-out infinite;}
  .firefly.f2{width:4px;height:4px;top:55%;left:85%;animation:fireflyDrift2 11s ease-in-out infinite;}
  .firefly.f3{width:6px;height:6px;top:78%;left:12%;animation:fireflyDrift3 8s ease-in-out infinite;}
  .firefly.f4{width:4px;height:4px;top:30%;left:90%;animation:fireflyDrift1 12s ease-in-out infinite reverse;}
  @keyframes fireflyDrift1{
    0%,100%{transform:translate(0,0);opacity:.3;}
    25%{transform:translate(18px,-22px);opacity:.9;}
    50%{transform:translate(-10px,-40px);opacity:.4;}
    75%{transform:translate(-24px,-12px);opacity:.85;}
  }
  @keyframes fireflyDrift2{
    0%,100%{transform:translate(0,0);opacity:.35;}
    30%{transform:translate(-22px,18px);opacity:.9;}
    60%{transform:translate(14px,32px);opacity:.4;}
    85%{transform:translate(26px,6px);opacity:.8;}
  }
  @keyframes fireflyDrift3{
    0%,100%{transform:translate(0,0);opacity:.3;}
    40%{transform:translate(20px,20px);opacity:.85;}
    70%{transform:translate(-18px,10px);opacity:.5;}
  }
  .cloud{position:fixed;font-size:30px;opacity:.3;animation:cloudDrift linear infinite;}
  .cloud.c1{top:8%;animation-duration:40s;}
  .cloud.c2{top:20%;animation-duration:54s;animation-delay:-16s;font-size:24px;opacity:.22;}
  @keyframes cloudDrift{
    from{transform:translateX(-15vw);}
    to{transform:translateX(115vw);}
  }

  h1{
    font-family:'Baloo 2',cursive;
    font-weight:800;
    font-size:clamp(28px,5vw,42px);
    margin:6px 0 2px;
    letter-spacing:.5px;
    text-shadow:0 0 18px rgba(182,166,255,.45);
    z-index:1;
  }
  .subtitle{color:var(--muted);margin-bottom:20px;font-weight:600;font-size:14px;letter-spacing:.3px;z-index:1;}

  .panel{
    display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    margin-bottom:18px;z-index:1;
  }
  .diff-btn{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:14px;
    padding:9px 18px;
    border-radius:999px;
    border:2px solid var(--tile-edge);
    background:rgba(255,255,255,0.03);
    color:var(--cream);
    cursor:pointer;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .diff-btn:hover{transform:translateY(-2px);}
  .diff-btn.active{
    background:linear-gradient(135deg,var(--lavender),var(--pink));
    color:#241c47;
    border-color:transparent;
    box-shadow:0 6px 18px rgba(182,166,255,.35);
  }

  .stats{
    display:flex;gap:22px;margin-bottom:20px;font-family:'Baloo 2',cursive;font-weight:700;z-index:1;
  }
  .stat{
    background:rgba(255,255,255,.04);
    border:1px solid var(--tile-edge);
    padding:8px 16px;
    border-radius:14px;
    font-size:14px;
    color:var(--lavender);
    min-width:88px;
    text-align:center;
  }
  .stat span{display:block;color:var(--cream);font-size:18px;margin-top:2px;}

  .board{
    display:grid;
    gap:12px;
    z-index:1;
    perspective:800px;
  }

  .tile{
    width:78px;height:78px;
    cursor:pointer;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.9,.3,1.1);
  }
  .tile.flipped{transform:rotateY(180deg);}
  .tile.matched{
    animation:wake .55s ease;
  }
  @keyframes wake{
    0%{transform:rotateY(180deg) scale(1);}
    45%{transform:rotateY(180deg) scale(1.18);}
    100%{transform:rotateY(180deg) scale(1);}
  }

  .face{
    position:absolute;inset:0;
    border-radius:20px;
    backface-visibility:hidden;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;
  }
  .face.back{
    background:linear-gradient(155deg,var(--tile),#0e1c3d);
    border:2px solid var(--tile-edge);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), 0 6px 14px rgba(0,0,0,.35);
  }
  .face.back::after{
    content:"✦";
    color:var(--lavender);
    opacity:.55;
    font-size:20px;
  }
  .face.front{
    background:radial-gradient(circle at 35% 30%, #234280, #132552 70%);
    border:2px solid var(--tile-edge);
    transform:rotateY(180deg);
  }
  .tile.matched .face.front{
    background:radial-gradient(circle at 35% 30%, #2f5498, #16295a 70%);
    border-color:var(--gold);
    box-shadow:0 0 22px rgba(255,211,123,.45);
  }
  .zzz{
    position:absolute;
    top:-6px;right:2px;
    font-size:11px;
    color:var(--lavender);
    opacity:0;
  }
  .tile.flipped:not(.matched) .zzz{
    opacity:.85;
    animation:floatUp 1.4s ease-in infinite;
  }
  @keyframes floatUp{
    0%{transform:translateY(0);opacity:.85;}
    100%{transform:translateY(-14px);opacity:0;}
  }

  .footer-tip{margin-top:22px;color:var(--muted);font-size:13px;z-index:1;text-align:center;max-width:320px;}

  .back-btn{
    position:fixed;
    top:16px; left:16px;
    z-index:5;
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:13px;
    color:var(--cream);
    background:rgba(255,255,255,.05);
    border:2px solid var(--tile-edge);
    padding:8px 14px;
    border-radius:999px;
    text-decoration:none;
    transition:transform .15s ease, border-color .15s ease;
  }
  .back-btn:hover{
    transform:translateX(-3px);
    border-color:var(--lavender);
  }

  .overlay{
    position:fixed;inset:0;
    background:rgba(10,8,30,.72);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;justify-content:center;
    z-index:10;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .win-card{
    background:linear-gradient(160deg,#16295a,#0d1938);
    border:2px solid var(--tile-edge);
    border-radius:24px;
    padding:34px 30px;
    text-align:center;
    max-width:320px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    position:relative;
    overflow:hidden;
  }
  .win-card h2{
    font-family:'Baloo 2',cursive;
    color:var(--gold);
    font-size:26px;
    margin:8px 0 4px;
  }
  .win-card p{color:var(--muted);font-size:14px;margin:4px 0 20px;}
  .win-stats{display:flex;justify-content:center;gap:24px;margin-bottom:22px;}
  .win-stats div{font-family:'Baloo 2',cursive;color:var(--cream);}
  .win-stats small{display:block;color:var(--muted);font-weight:600;font-size:11px;}
  .again-btn{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    background:linear-gradient(135deg,var(--pink),var(--lavender));
    color:#241c47;
    border:none;
    padding:12px 26px;
    border-radius:14px;
    cursor:pointer;
    font-size:15px;
  }
  .again-btn:hover{filter:brightness(1.06);}
  .sparkle{position:absolute;font-size:20px;opacity:.8;animation:sparkleFloat 2.2s ease-in-out infinite;}
  @keyframes sparkleFloat{
    0%,100%{transform:translateY(0) rotate(0deg);opacity:.5;}
    50%{transform:translateY(-8px) rotate(15deg);opacity:1;}
  }

  .burst-particle{
    position:fixed;
    font-size:14px;
    pointer-events:none;
    z-index:20;
    animation:burstOut .7s ease-out forwards;
  }
  @keyframes burstOut{
    0%{transform:translate(0,0) scale(1);opacity:1;}
    100%{transform:translate(var(--bx),var(--by)) scale(.4);opacity:0;}
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="ambient-layer">
  <span class="firefly f1"></span>
  <span class="firefly f2"></span>
  <span class="firefly f3"></span>
  <span class="firefly f4"></span>
  <span class="cloud c1">☁️</span>
  <span class="cloud c2">☁️</span>
</div>

<a class="back-btn" href="./index.html">← Về vườn</a>

<h1>🌙 Vườn Trăng Ngủ</h1>
<div class="subtitle">Lật ô, tìm hai bạn thú ngủ giống nhau nhé</div>

<div class="panel">
  <button class="diff-btn" data-cols="3" data-pairs="6">Dễ · 6 cặp</button>
  <button class="diff-btn" data-cols="4" data-pairs="8">Vừa · 8 cặp</button>
  <button class="diff-btn" data-cols="4" data-pairs="10">Khó · 10 cặp</button>
</div>

<div class="stats">
  <div class="stat">Lượt lật<span id="moves">0</span></div>
  <div class="stat">Thời gian<span id="timer">0:00</span></div>
  <div class="stat">Còn lại<span id="remaining">0</span></div>
</div>

<div class="board" id="board"></div>

<div class="footer-tip">Mẹo: nhớ vị trí các bạn thú đã lật để ghép cặp nhanh hơn 🐾</div>

<div class="overlay" id="overlay">
  <div class="win-card">
    <div class="sparkle" style="top:10px;left:20px;">✦</div>
    <div class="sparkle" style="top:20px;right:24px;animation-delay:.6s;">✧</div>
    <div class="sparkle" style="bottom:14px;left:34px;animation-delay:1.1s;">✦</div>
    <div style="font-size:38px;">🌙💤</div>
    <h2>Cả vườn đã ngủ ngon!</h2>
    <p>Bạn đã đánh thức đúng cặp cho tất cả các bạn thú</p>
    <div class="win-stats">
      <div><span id="finalMoves">0</span><small>LƯỢT LẬT</small></div>
      <div><span id="finalTime">0:00</span><small>THỜI GIAN</small></div>
    </div>
    <button class="again-btn" id="againBtn">Chơi lại</button>
  </div>
</div>

<script>
const CRITTERS = ['🐰','🦊','🐻','🐱','🐼','🦉','🐨','🐹','🐸','🐢','🦔','🐿️'];

const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const remainingEl = document.getElementById('remaining');
const overlay = document.getElementById('overlay');
const diffButtons = document.querySelectorAll('.diff-btn');

let cols = 4, pairsCount = 8;
let tiles = [];
let flipped = [];
let matchedCount = 0;
let moves = 0;
let timerInterval = null;
let seconds = 0;
let lockBoard = false;

function formatTime(s){
  const m = Math.floor(s/60);
  const r = s%60;
  return m + ':' + (r<10?'0':'') + r;
}

function startTimer(){
  if(timerInterval) return;
  timerInterval = setInterval(()=>{
    seconds++;
    timerEl.textContent = formatTime(seconds);
  },1000);
}
function stopTimer(){
  clearInterval(timerInterval);
  timerInterval = null;
}

function buildStars(){
  const wrap = document.getElementById('stars');
  wrap.innerHTML = '';
  for(let i=0;i<40;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2+1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3)+'s';
    wrap.appendChild(s);
  }
}

function newGame(){
  stopTimer();
  seconds = 0;
  moves = 0;
  matchedCount = 0;
  flipped = [];
  lockBoard = false;
  timerEl.textContent = '0:00';
  movesEl.textContent = '0';
  remainingEl.textContent = pairsCount;
  overlay.classList.remove('show');

  const chosen = CRITTERS.slice(0, pairsCount);
  let deck = [...chosen, ...chosen];
  deck.sort(()=>Math.random()-0.5);

  board.style.gridTemplateColumns = `repeat(${cols}, 78px)`;
  board.innerHTML = '';
  tiles = deck.map((critter, i)=>{
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.critter = critter;
    tile.dataset.index = i;
    tile.innerHTML = `
      <div class="face back"></div>
      <div class="face front">${critter}<span class="zzz">z z z</span></div>
    `;
    tile.addEventListener('click', ()=>onTileClick(tile));
    board.appendChild(tile);
    return tile;
  });
}

function onTileClick(tile){
  if(lockBoard) return;
  if(tile.classList.contains('flipped') || tile.classList.contains('matched')) return;

  startTimer();
  tile.classList.add('flipped');
  flipped.push(tile);

  if(flipped.length === 2){
    moves++;
    movesEl.textContent = moves;
    lockBoard = true;
    const [a,b] = flipped;
    if(a.dataset.critter === b.dataset.critter){
      setTimeout(()=>{
        a.classList.add('matched');
        b.classList.add('matched');
        spawnBurst(a);
        spawnBurst(b);
        matchedCount++;
        remainingEl.textContent = pairsCount - matchedCount;
        flipped = [];
        lockBoard = false;
        if(matchedCount === pairsCount){
          stopTimer();
          setTimeout(showWin, 500);
        }
      },320);
    } else {
      setTimeout(()=>{
        a.classList.remove('flipped');
        b.classList.remove('flipped');
        flipped = [];
        lockBoard = false;
      },800);
    }
  }
}

function spawnBurst(tile){
  const rect = tile.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const glyphs = ['✦','✧','⭐','💫'];
  for(let i=0;i<6;i++){
    const p = document.createElement('div');
    p.className = 'burst-particle';
    p.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    const angle = (Math.PI*2/6)*i + Math.random()*0.4;
    const dist = 40 + Math.random()*20;
    p.style.setProperty('--bx', Math.cos(angle)*dist + 'px');
    p.style.setProperty('--by', Math.sin(angle)*dist + 'px');
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.color = Math.random() > 0.5 ? 'var(--gold)' : 'var(--lavender)';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 750);
  }
}

function showWin(){
  document.getElementById('finalMoves').textContent = moves;
  document.getElementById('finalTime').textContent = formatTime(seconds);
  overlay.classList.add('show');
}

diffButtons.forEach(btn=>{
  btn.addEventListener('click', ()=>{
    diffButtons.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    cols = parseInt(btn.dataset.cols);
    pairsCount = parseInt(btn.dataset.pairs);
    newGame();
  });
});

document.getElementById('againBtn').addEventListener('click', newGame);

// init
diffButtons[1].classList.add('active');
buildStars();
newGame();
</script>
</body>
</html>
